<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pantry Print — snap groceries, get a recipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1EEE4;
    --paper-dim:#E6E2D4;
    --ink:#20291F;
    --ink-soft:#5C6459;
    --rule:#B8B29B;
    --mustard:#C98A17;
    --mustard-deep:#8A5D0C;
    --green:#3C6146;
    --green-deep:#264530;
    --red:#A5372A;
    --red-deep:#732418;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#DAD5C4;
    font-family:'Space Mono', monospace;
    color:var(--ink);
    padding:40px 16px;
    display:flex;
    justify-content:center;
  }
  .machine{
    width:100%;
    max-width:480px;
  }
  .slot{
    background:var(--paper);
    border-radius:2px;
    box-shadow:0 18px 40px rgba(0,0,0,0.18);
    padding:28px 26px 18px;
    position:relative;
  }
  .slot::after{
    content:"";
    display:block;
    height:14px;
    margin:0 -26px -18px;
    background:
      radial-gradient(circle at 10px 0, transparent 8px, var(--paper) 8.5px) top left / 20px 14px repeat-x;
  }
  .brand{
    text-align:center;
    margin-bottom:4px;
  }
  .brand h1{
    font-size:22px;
    font-weight:700;
    letter-spacing:3px;
    margin:0;
  }
  .brand p{
    font-size:11px;
    letter-spacing:1.5px;
    color:var(--ink-soft);
    margin:6px 0 0;
    text-transform:uppercase;
  }
  .dotted{
    border-top:2px dotted var(--rule);
    margin:18px 0;
  }
  .pantry-strip{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:4px;
  }
  .pantry-chip{
    font-size:11px;
    background:var(--paper-dim);
    border:1px solid var(--rule);
    border-radius:20px;
    padding:3px 10px;
    letter-spacing:0.5px;
  }
  .pantry-label{
    font-size:11px;
    letter-spacing:1.5px;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  .empty-pantry{
    font-size:12px;
    color:var(--ink-soft);
    font-style:normal;
  }
  .upload-zone{
    border:2px dashed var(--rule);
    border-radius:6px;
    padding:22px 14px;
    text-align:center;
    cursor:pointer;
    transition:border-color 0.15s, background 0.15s;
  }
  .upload-zone:hover{
    border-color:var(--green);
    background:rgba(60,97,70,0.05);
  }
  .upload-zone input{display:none;}
  .upload-icon{
    font-size:26px;
    margin-bottom:6px;
  }
  .upload-title{
    font-size:13px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .upload-sub{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .preview-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:10px;
  }
  .preview-thumb{
    width:44px;
    height:44px;
    object-fit:cover;
    border:1px solid var(--rule);
    border-radius:4px;
    flex-shrink:0;
  }
  .status-line{
    font-size:12px;
    letter-spacing:0.5px;
  }
  .status-line.error{ color:var(--red-deep); }
  .status-line.ok{ color:var(--green-deep); }
  .dots::after{
    content:"";
    animation:dotting 1.4s infinite steps(4);
  }
  @keyframes dotting{
    0%{content:"";} 25%{content:".";} 50%{content:"..";} 75%{content:"...";}
  }
  .item-line{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    padding:5px 0;
    opacity:0;
    transform:translateY(4px);
    animation:printIn 0.32s ease forwards;
  }
  @keyframes printIn{
    to{opacity:1; transform:translateY(0);}
  }
  .item-name{letter-spacing:0.5px;}
  .item-tag{color:var(--ink-soft);}
  .section-label{
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .recipe-card{
    margin-top:6px;
  }
  .stamp{
    display:inline-block;
    border:2px solid var(--mustard-deep);
    color:var(--mustard-deep);
    font-size:11px;
    font-weight:700;
    letter-spacing:2px;
    padding:3px 10px;
    border-radius:4px;
    transform:rotate(-3deg);
    margin-bottom:10px;
  }
  .recipe-title{
    font-family:'Source Serif 4', serif;
    font-size:21px;
    font-weight:700;
    line-height:1.25;
    margin:0 0 8px;
  }
  .recipe-meta{
    display:flex;
    gap:16px;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:14px;
  }
  .have-need{
    font-size:13px;
    font-family:'Source Serif 4', serif;
    margin-bottom:6px;
    line-height:1.5;
  }
  .have-need b{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:1px;
    color:var(--ink-soft);
    display:block;
    margin-bottom:2px;
  }
  .need b{ color:var(--red-deep); }
  .steps{
    margin-top:14px;
    font-family:'Source Serif 4', serif;
    font-size:14px;
    line-height:1.6;
  }
  .step{
    display:flex;
    gap:10px;
    margin-bottom:10px;
  }
  .step-num{
    font-family:'Space Mono', monospace;
    font-size:12px;
    font-weight:700;
    color:var(--green-deep);
    min-width:20px;
  }
  .actions{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  .btn{
    flex:1;
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    font-weight:700;
    padding:11px 8px;
    border-radius:5px;
    border:1px solid var(--ink);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
    transition:transform 0.1s, background 0.15s;
  }
  .btn:hover{ background:rgba(32,41,31,0.06); }
  .btn:active{ transform:scale(0.97); }
  .btn.primary{
    background:var(--green-deep);
    border-color:var(--green-deep);
    color:var(--paper);
  }
  .btn.primary:hover{ background:var(--green); }
  .btn:disabled{ opacity:0.45; cursor:default; transform:none; }
  .footer-stub{
    text-align:center;
    font-size:11px;
    letter-spacing:2px;
    color:var(--ink-soft);
    margin-top:22px;
    text-transform:uppercase;
  }
  .barcode{
    display:flex;
    justify-content:center;
    gap:2px;
    margin:10px 0 4px;
  }
  .barcode span{
    display:block;
    width:2px;
    background:var(--ink);
    opacity:0.6;
  }
  .hidden{ display:none !important; }
  .fade-in{
    animation:fadeIn 0.4s ease forwards;
  }
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }
  .note{
    font-size:11px;
    color:var(--ink-soft);
    text-align:center;
    margin-top:14px;
    line-height:1.5;
  }
</style>
</head>
<body>

<div class="machine">
  <div class="slot">

    <div class="brand">
      <h1>PANTRY PRINT</h1>
      <p>snap groceries → get a receipt → get a recipe</p>
    </div>

    <div class="dotted"></div>

    <div class="pantry-label">your pantry ledger</div>
    <div id="pantryStrip" class="pantry-strip" style="margin-bottom:14px;">
      <span class="empty-pantry">nothing scanned yet</span>
    </div>

    <label class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept="image/*" multiple>
      <div class="upload-icon">&#128247;</div>
      <div class="upload-title">Scan groceries</div>
      <div class="upload-sub">Take or upload one photo, or select several at once &mdash; fridge, freezer, pantry</div>
    </label>

    <div id="previewRow" class="preview-row hidden">
      <div id="previewThumbs" style="display:flex; gap:6px;"></div>
      <div id="statusLine" class="status-line">Ready to print</div>
    </div>

    <div id="itemsSection" class="hidden">
      <div class="dotted"></div>
      <div class="section-label">items detected</div>
      <div id="itemsList"></div>
      <div class="dotted"></div>
    </div>

    <div id="recipeSection" class="hidden recipe-card fade-in">
      <span class="stamp">today's special</span>
      <div id="recipeTitle" class="recipe-title"></div>
      <div id="recipeMeta" class="recipe-meta"></div>

      <div class="have-need">
        <b>you have</b>
        <span id="haveList"></span>
      </div>
      <div class="have-need need">
        <b>you need</b>
        <span id="needList"></span>
      </div>

      <div id="stepsList" class="steps"></div>

      <div class="actions">
        <button class="btn" id="anotherRecipeBtn">Print new recipe</button>
        <button class="btn primary" id="scanAnotherBtn">Scan again</button>
      </div>
    </div>

    <div id="errorSection" class="hidden">
      <div class="dotted"></div>
      <div class="status-line error" id="errorText"></div>
      <div class="actions">
        <button class="btn" id="retryBtn">Try again</button>
      </div>
    </div>

    <div class="footer-stub">
      <div class="barcode" id="barcode"></div>
      thank you for shopping
    </div>
  </div>

  <p class="note">Prototype for MBA tech immersion — runs live vision + generation calls to Claude for every scan.</p>
</div>

<script>
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const previewRow = document.getElementById('previewRow');
const previewThumbs = document.getElementById('previewThumbs');
const statusLine = document.getElementById('statusLine');
const itemsSection = document.getElementById('itemsSection');
const itemsList = document.getElementById('itemsList');
const recipeSection = document.getElementById('recipeSection');
const errorSection = document.getElementById('errorSection');
const errorText = document.getElementById('errorText');
const pantryStrip = document.getElementById('pantryStrip');
const recipeTitle = document.getElementById('recipeTitle');
const recipeMeta = document.getElementById('recipeMeta');
const haveList = document.getElementById('haveList');
const needList = document.getElementById('needList');
const stepsList = document.getElementById('stepsList');
const anotherRecipeBtn = document.getElementById('anotherRecipeBtn');
const scanAnotherBtn = document.getElementById('scanAnotherBtn');
const retryBtn = document.getElementById('retryBtn');
const barcode = document.getElementById('barcode');

let pantry = [];
let previousTitles = [];

function renderBarcode(){
  barcode.innerHTML = '';
  for(let i=0;i<28;i++){
    const bar = document.createElement('span');
    const h = 10 + Math.round(Math.random()*10);
    bar.style.height = h + 'px';
    bar.style.width = (Math.random() > 0.7 ? '3px' : '1.5px');
    barcode.appendChild(bar);
  }
}
renderBarcode();

function renderPantry(){
  if(pantry.length === 0){
    pantryStrip.innerHTML = '<span class="empty-pantry">nothing scanned yet</span>';
    return;
  }
  pantryStrip.innerHTML = pantry.map(function(item){
    return '<span class="pantry-chip">' + escapeHtml(item) + '</span>';
  }).join('');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function fileToBase64(file){
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onload = function(){ resolve(reader.result.split(',')[1]); };
    reader.onerror = function(){ reject(new Error('Could not read the photo')); };
    reader.readAsDataURL(file);
  });
}

function showError(msg){
  itemsSection.classList.add('hidden');
  recipeSection.classList.add('hidden');
  errorSection.classList.remove('hidden');
  errorText.textContent = 'RECEIPT VOID — ' + msg;
}

function resetForNewScan(){
  errorSection.classList.add('hidden');
  itemsSection.classList.add('hidden');
  recipeSection.classList.add('hidden');
  previewRow.classList.add('hidden');
  fileInput.value = '';
}

function parseJsonFromText(text){
  let cleaned = text.trim();
  cleaned = cleaned.replace(/^```json/i, '').replace(/^```/, '').replace(/```$/, '').trim();
  const start = cleaned.indexOf('{');
  const end = cleaned.lastIndexOf('}');
  if(start === -1 || end === -1) throw new Error('no JSON found');
  return JSON.parse(cleaned.slice(start, end + 1));
}

async function callClaude(messages){
  const response = await fetch('/api/pantry', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1000,
      messages: messages
    })
  });
  if(!response.ok){
    if(response.status === 429){
      throw new Error('This demo has hit today\'s usage cap \u2014 try again tomorrow.');
    }
    throw new Error('API returned status ' + response.status);
  }
  const data = await response.json();
  const textBlock = (data.content || []).find(function(b){ return b.type === 'text'; });
  if(!textBlock) throw new Error('no text in response');
  return textBlock.text;
}

function renderItems(items){
  itemsList.innerHTML = '';
  itemsSection.classList.remove('hidden');
  items.forEach(function(item, i){
    const row = document.createElement('div');
    row.className = 'item-line';
    row.style.animationDelay = (i * 0.12) + 's';
    row.innerHTML = '<span class="item-name">' + escapeHtml(item) + '</span><span class="item-tag">NEW</span>';
    itemsList.appendChild(row);
  });
}

function renderRecipe(recipe){
  recipeTitle.textContent = recipe.title || 'Chef\'s surprise';
  recipeMeta.textContent = (recipe.time || '20 min') + '  ·  ' + (recipe.servings || '2 servings');
  haveList.textContent = (recipe.have || []).join(', ') || '—';
  needList.textContent = (recipe.need || []).length ? recipe.need.join(', ') : 'nothing — you\'re fully stocked';
  stepsList.innerHTML = '';
  (recipe.steps || []).forEach(function(step, i){
    const row = document.createElement('div');
    row.className = 'step';
    row.innerHTML = '<span class="step-num">' + String(i+1).padStart(2,'0') + '</span><span>' + escapeHtml(step) + '</span>';
    stepsList.appendChild(row);
  });
  recipeSection.classList.remove('hidden');
  previousTitles.push(recipe.title);
  renderBarcode();
}

const MAX_PHOTOS_PER_SCAN = 6;

async function scanPhotos(fileList){
  let files = Array.from(fileList).filter(function(f){ return f.type && f.type.indexOf('image/') === 0; });
  if(files.length === 0){
    showError('that didn\'t look like an image. try a photo instead.');
    return;
  }
  const overflow = files.length > MAX_PHOTOS_PER_SCAN;
  if(overflow) files = files.slice(0, MAX_PHOTOS_PER_SCAN);

  resetForNewScan();
  previewRow.classList.remove('hidden');
  previewThumbs.innerHTML = '';
  files.forEach(function(file){
    const img = document.createElement('img');
    img.className = 'preview-thumb';
    img.src = URL.createObjectURL(file);
    previewThumbs.appendChild(img);
  });
  statusLine.textContent = 'Printing';
  statusLine.classList.add('dots');

  try{
    const imageBlocks = await Promise.all(files.map(async function(file){
      const base64 = await fileToBase64(file);
      return { type: 'image', source: { type: 'base64', media_type: file.type || 'image/jpeg', data: base64 } };
    }));

    const prompt = 'You are the vision engine for a grocery-to-recipe app. Look at these ' + files.length + ' photo(s), which may show different parts of the same kitchen (fridge, freezer, pantry, counter). Identify distinct grocery or food items visible across ALL photos combined, without duplicating an item that appears in more than one photo. ' +
      'The user already has this pantry: ' + JSON.stringify(pantry) + '. ' +
      'Return ONLY items visible in these photos that are not already in the pantry list, as short plain names (e.g. "eggs", "spinach", "cheddar"). ' +
      'Then, using the combined pantry (existing pantry plus new items), suggest one simple, realistic recipe using mostly what they have. ' +
      'Respond with ONLY valid JSON, no preamble, no markdown fences, in this exact shape: ' +
      '{"newItems": ["item1","item2"], "recipe": {"title": "string", "time": "string", "servings": "string", "have": ["item1"], "need": ["item2"], "steps": ["step1","step2","step3"]}}. ' +
      'Keep steps to at most 5 short sentences. If no food is visible in any photo, return {"newItems": [], "recipe": null}.';

    const responseText = await callClaude([
      {
        role: 'user',
        content: imageBlocks.concat([{ type: 'text', text: prompt }])
      }
    ]);

    const parsed = parseJsonFromText(responseText);
    const newItems = parsed.newItems || [];

    if(newItems.length === 0 && !parsed.recipe){
      showError('no groceries recognized in ' + (files.length > 1 ? 'those photos' : 'that photo') + '. try a clearer shot.');
      return;
    }

    statusLine.classList.remove('dots');
    let statusMsg = newItems.length + ' new item' + (newItems.length === 1 ? '' : 's') + ' detected';
    if(files.length > 1) statusMsg += ' across ' + files.length + ' photos';
    if(overflow) statusMsg += ' (only first ' + MAX_PHOTOS_PER_SCAN + ' photos used)';
    statusLine.textContent = statusMsg;

    pantry = pantry.concat(newItems.filter(function(i){ return pantry.indexOf(i) === -1; }));
    renderPantry();
    renderItems(newItems.length ? newItems : ['(all items already in pantry)']);

    if(parsed.recipe){
      setTimeout(function(){ renderRecipe(parsed.recipe); }, newItems.length * 120 + 250);
    }
  }catch(err){
    statusLine.classList.remove('dots');
    showError(err.message || 'something jammed the printer.');
  }
}

async function generateAnotherRecipe(){
  anotherRecipeBtn.disabled = true;
  anotherRecipeBtn.textContent = 'Printing…';
  try{
    const prompt = 'The user has this pantry: ' + JSON.stringify(pantry) + '. ' +
      'They already got these recipes: ' + JSON.stringify(previousTitles) + '. ' +
      'Suggest one different, simple, realistic recipe using mostly what they have. ' +
      'Respond with ONLY valid JSON, no preamble, no markdown fences, in this exact shape: ' +
      '{"title": "string", "time": "string", "servings": "string", "have": ["item1"], "need": ["item2"], "steps": ["step1","step2","step3"]}. ' +
      'Keep steps to at most 5 short sentences.';
    const responseText = await callClaude([{ role: 'user', content: prompt }]);
    const recipe = parseJsonFromText(responseText);
    renderRecipe(recipe);
  }catch(err){
    showError(err.message || 'the printer jammed on that one.');
  }finally{
    anotherRecipeBtn.disabled = false;
    anotherRecipeBtn.textContent = 'Print new recipe';
  }
}

uploadZone.addEventListener('click', function(e){
  if(e.target !== fileInput) fileInput.click();
});
fileInput.addEventListener('change', function(){
  if(fileInput.files && fileInput.files.length){
    scanPhotos(fileInput.files);
  }
});
uploadZone.addEventListener('dragover', function(e){ e.preventDefault(); });
uploadZone.addEventListener('drop', function(e){
  e.preventDefault();
  if(e.dataTransfer.files && e.dataTransfer.files.length){
    fileInput.files = e.dataTransfer.files;
    scanPhotos(e.dataTransfer.files);
  }
});
scanAnotherBtn.addEventListener('click', function(){
  resetForNewScan();
  fileInput.click();
});
retryBtn.addEventListener('click', function(){
  resetForNewScan();
  fileInput.click();
});
anotherRecipeBtn.addEventListener('click', generateAnotherRecipe);
</script>

</body>
</html>
